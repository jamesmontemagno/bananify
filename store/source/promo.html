<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bananify small promotional tile</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; width: 440px; height: 280px; overflow: hidden; background: #ffdc45; color: #263e2e; font-family: "Arial Rounded MT Bold", "Trebuchet MS", sans-serif; }
    main { position: relative; height: 100%; padding: 23px 26px; }
    h1 { font-size: 27px; margin: 0; letter-spacing: -.7px; }
    p { position: relative; z-index: 1; margin: 29px 0 0; font-size: 35px; line-height: 1.07; font-weight: 900; letter-spacing: -1px; }
    .monkey { position: absolute; width: 210px; right: -3px; bottom: 29px; transform: rotate(6deg); }
    .monkey > svg { width: 100%; display: block; }
    footer { position: absolute; bottom: 0; left: 0; right: 0; background: #215c40; color: #ffdc45; padding: 12px 26px; font: bold 14px Arial, sans-serif; }
  </style>
</head>
<body>
  <main>
    <h1>bananify.</h1>
    <p>The internet.<br>But bananas.</p>
    <div class="monkey" id="monkey"></div>
    <footer>bananify.online</footer>
  </main>
</body>
</html>
